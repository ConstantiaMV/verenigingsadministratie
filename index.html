// ===== Shell + menu =====

async function boot(email){
 try{
  if(!await q(sb.rpc('is_lid_email',{p_email:email}))){await sb.auth.signOut();return login('Dit e-mailadres komt niet (meer) voor in de ledenadministratie.')}

 }catch(er){return login(er.message)}

// ===== Generieke formulier- en lijstfuncties =====
function form(title,F,v,save,del,msg){
 const d=document.createElement('dialog');
 const h=F.map(([k,l,t,o,hn])=>{const x=v[k]??'',r=l.endsWith('*')?'required':'';let i;
  if(t=='sel')i=`<select name="${k}" ${r}><option></option>${o.map(s=>`<option ${s==x?'selected':''}>${e(s)}</option>`).join('')}</select>`;
  else if(t=='multi')i=`<select name="${k}" multiple size=5>${o.map(([a,b])=>`<option value="${a}" ${(x||[]).includes(a)?'selected':''}>${e(b)}</option>`).join('')}</select>`;
  else if(t=='area')i=`<textarea name="${k}" rows=3>${e(x)}</textarea>`;
  else if(t=='bool')i=`<input type=checkbox name="${k}" ${x?'checked':''}>`;
  else if(t=='ro')i=`<input name="${k}" value="${e(x)}" readonly>`;
  else if(t=='chk')i=o.map(s=>`<span style="margin-right:14px"><input type=checkbox name="${k}" value="${e(s)}" ${(x||[]).includes(s)?'checked':''}> ${e(s)}</span>`).join('');
  else if(t=='hist')i=`<div class=hist data-k="${k}">${(x||[]).map(hr).join('')}</div><button type=button class=s onclick="this.previousElementSibling.insertAdjacentHTML('beforeend',hr({}))">+ Jaar toevoegen</button>`;
  else i=`<input name="${k}" type="${t}" value="${e(x)}" ${t=='number'?'step=any':''} ${r}>`;
  const tg=['hist','chk'].includes(t)?'div':'label';
  return `<${tg} class="lb ${['hist','area','multi','chk'].includes(t)?'full':''}">${e(l.replace(/\*$/,''))}${r?' *':''}${i}${hn?`<span class=sm>${e(hn)}</span>`:''}</${tg}>`}).join('');
 d.innerHTML=`<form><h2>${title}</h2><div class=g>${h}</div><p class=bar><button>Opslaan</button><button type=button class=s id=x>Annuleren</button>${del?'<button type=button class=d id=del>Verwijderen</button>':''}</p></form>`;
 document.body.append(d);d.showModal();
 d.querySelector('#x').onclick=()=>d.remove();
 const ac=d.querySelector('[name=actief]'),us=d.querySelector('[name=uitschrijfdatum]');
 if(ac&&us){const w=us.closest('label'),f=()=>{w.style.display=ac.checked?'none':'';us.required=!ac.checked};ac.onchange=f;f()}
 if(del)d.querySelector('#del').onclick=async()=>{if(!confirm(msg||'Weet je zeker dat je dit wilt verwijderen?'))return;try{await del();d.remove()}catch(er){toast(er.message,1)}};
 d.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const o={};
  F.forEach(([k,,t])=>{
   if(t=='hist'){o[k]=[...d.querySelector(`.hist[data-k="${k}"]`).children].map(r=>{const[a,b]=r.querySelectorAll('select,input');return b.value===''?null:{jaar:+a.value,bedrag:+b.value,betaalwijze:r.dataset.bw||null}}).filter(Boolean);return}
   if(t=='chk'){o[k]=[...d.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>x.value);return}
   const el=d.querySelector(`[name="${k}"]`);
   if(t=='ro')return;if(t=='bool')o[k]=el.checked;else if(t=='multi')o[k]=[...el.selectedOptions].map(x=>+x.value);
   else{o[k]=el.value.trim()||null;if(t=='number'&&o[k]!=null)o[k]=+o[k]}});
  try{await save(o);d.remove();toast('Opgeslagen')}catch(er){toast(er.message,1)}};
}
let lidF=null;
function list(rows,cols,fn,o={}){
 const s=main.querySelector('input.q'),t=main.querySelector('.tb'),st=o.state||{},hf=!!o.filters;
 const txt=(c,r)=>String(c[1](r)??'');
 const mt=(c,r,v)=>{const x=txt(c,r);return c[2]=='pre'?x.startsWith(v):c[2]=='sel'?x.split(', ').includes(v):x.toLowerCase().includes(v.toLowerCase())};

 const draw=()=>{const f=s.value.toLowerCase(),R=rows.filter(r=>JSON.stringify(Object.values(r)).toLowerCase().includes(f)&&cols.every(c=>!st[c[0]]||mt(c,r,st[c[0]])));
  t.querySelector('tbody').innerHTML=R.map(r=>`<tr class=c>${cols.map(c=>`<td>${e(txt(c,r))}`).join('')}`).join('');
  t.querySelectorAll('tbody tr').forEach((tr,i)=>tr.onclick=()=>fn(R[i]));
  if(hf)t.querySelector('.cnt').innerHTML=`${R.length} van ${rows.length} getoond`+(Object.values(st).some(Boolean)?' · <a href=# class=cf>Filters wissen</a>':'')};
 if(hf){t.querySelectorAll('.fr [data-i]').forEach(el=>el[el.tagName=='SELECT'?'onchange':'oninput']=()=>{st[cols[el.dataset.i][0]]=el.value;draw()});

async function vLeden(){
 const L=await q(sb.from('leden').select('*').order('achternaam'));
 const G=(await q(sb.from('groepen').select('naam').order('naam'))).map(x=>x.naam);
 const F=[['lidnr','Lidnr.','ro'],['voornaam','Voornaam*','text'],['achternaam','Achternaam*','text'],['email','E-mailadres (inlognaam)*','email'],['adres','Adres','text'],['postcode','Postcode','text'],['woonplaats','Woonplaats','text'],['telefoon','Telefoonnummer','tel'],['geboortedatum','Geboortedatum','date'],['geslacht','Geslacht','sel',['M','V']],['lid_sinds','Lid sinds','date'],['instrument','Instrument','text'],['sectie','Sectie','text'],['docent','Docent','text'],['groepen','Groepen','chk',G],['actief','Ingeschreven','bool'],['uitschrijfdatum','Uitschrijving van kracht per','date']];

 lidF??={Status:'Ingeschreven'};
 list(L,[['Lidnr.',r=>r.lidnr,'geen'],['Naam',r=>r.achternaam+', '+r.voornaam],['Instrument',r=>r.instrument,'sel',[...new Set(L.map(x=>x.instrument).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'))],['Groepen',r=>(r.groepen||[]).join(', '),'sel',G],['Lid sinds',r=>fd(r.lid_sinds),'geen'],['Status',r=>r.actief?'Ingeschreven':'Uitgeschreven per '+fd(r.uitschrijfdatum),'pre',['Ingeschreven','Uitgeschreven']]],open,{filters:true,state:lidF,widths:{'Lidnr.':'5%'}});
}

 const nm=Object.fromEntries(L.map(x=>[x.lidnr,x.voornaam+' '+x.achternaam]));
 const F=[['naam1','Naamregel 1*','text'],['naam2','Naamregel 2','text'],['adres','Adres*','text'],['huisnr','Huisnummer*','number'],['toevoeging','Toevoeging huisnummer','text'],['postcode','Postcode','text'],['woonplaats','Woonplaats','text'],['bijdrage','Donateursbijdrage (€)','number',null,'Leeg laten = geen donateur op dit adres'],['wijknr','Wijknummer*','sel',W,'Wijken en wijklopers beheer je onder Beheer'],['mededelingen','Mededelingen','area'],['hist','Historie: betaalde bijdrage per jaar','hist']];
 const open=r=>form(r?'Donateur bewerken':'Nieuwe donateur',F,r?{...r,hist:H.filter(h=>h.donateur_id==r.id)}:{hist:[],bijdrage:10},async o=>{
  const h=o.hist;delete o.hist;let id=r?.id;
  if(r)await q(sb.from('donateurs').update(o).eq('id',id));else id=(await q(sb.from('donateurs').insert(o).select('id').single())).id;
  await q(sb.from('donatie_historie').delete().eq('donateur_id',id));
  if(h.length)await q(sb.from('donatie_historie').insert(h.map(x=>({donateur_id:id,jaar:x.jaar,bedrag:x.bedrag,betaalwijze:x.betaalwijze}))));
